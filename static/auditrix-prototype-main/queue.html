<div class="view-stack queue-view">
<header class="topbar"><div><h1>Audit Queue</h1><div id="queueUpdated" class="muted queue-updated">Loading live audit records…</div></div><div class="queue-actions"><a class="button" href="/auditrix-prototype-main/audit-runner.html">＋ Run an Audit</a><button id="queueRefresh" class="button secondary" type="button">Refresh</button></div></header>
      <section class="card" aria-label="Audit queue filters"><div class="toolbar"><div id="queueTabs" class="queue-tabs"></div><select id="queueType" class="tab" aria-label="Filter by ticket type"><option value="all">All types</option><option value="INC">Incidents</option><option value="SR">Service Requests</option><option value="CR">Change Requests</option></select><input id="queueSearch" class="search" type="search" placeholder="Search ID, description, agent…"></div></section>

</div>
